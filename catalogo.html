<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DORÉ JOYERÍA · Catálogo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ac:#D4AF6A;--ac-d:#A9843F;--bg:#F7F5F2;--surface:#fff;--border:#E9E4DC;--txt:#1A1A1A}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:var(--txt);background:var(--bg);min-height:100vh}
input,select,textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;background:#fff;color:var(--txt);font-size:13px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac)}
textarea{resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 15px;border:1.5px solid var(--border);border-radius:8px;background:#fff;color:var(--txt);font-size:13px;cursor:pointer;font-family:inherit;font-weight:500;min-height:38px}
.btn:hover{background:var(--bg)}
.btn-r{background:var(--ac);border-color:var(--ac);color:#fff}
.btn-r:hover{background:var(--ac-d)}
.btn-sm{padding:5px 10px;font-size:12px;min-height:32px}
.btn-full{width:100%}
/* ── Header público ── */
.topbar{display:flex;align-items:center;gap:10px;padding:.6rem 1.25rem;background:#151312}
.topbar img{height:32px}
.topbar .adminlink{margin-left:auto;color:#6B655C;font-size:11px;text-decoration:none;cursor:pointer}
.topbar .adminlink:hover{color:#fff}
.hero{text-align:center;padding:2.25rem 1rem 1.5rem;background:#151312}
.hero img{height:90px;margin-bottom:10px}
.hero h1{color:#fff;font-size:20px;letter-spacing:1px;font-weight:600}
.hero p{color:#8A8378;font-size:13px;margin-top:4px}
.toolbar{max-width:1100px;margin:1.25rem auto 0;padding:0 1rem;display:flex;gap:8px;flex-wrap:wrap}
.toolbar input{flex:1;min-width:180px}
.toolbar select{width:160px}
.grid{max-width:1100px;margin:1rem auto 2.5rem;padding:0 1rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.1rem;text-align:center}
.pcard .foto{width:100%;height:190px;border-radius:8px;margin-bottom:.85rem;background:#F5F4F2;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.pcard .foto img{width:100%;height:100%;object-fit:contain}
.lightbox{position:fixed;inset:0;background:rgba(10,9,8,.92);z-index:9999;display:flex;align-items:center;justify-content:center;padding:2rem;cursor:zoom-out}
.lightbox{overflow:hidden;flex-direction:column;gap:12px}
.lightbox .lb-img{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:8px}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5);cursor:zoom-in;transition:transform .25s ease;user-select:none;-webkit-user-drag:none}
.lightbox img.zoom{transform:scale(2.5);cursor:zoom-out;transition:none}
.lightbox .lb-info{color:#fff;text-align:center;cursor:default}
.lightbox .lb-info .n{font-size:16px;font-weight:600}
.lightbox .lb-info .p{font-size:15px;opacity:.85;margin-top:2px}
.lightbox .lb-hint{color:rgba(255,255,255,.55);font-size:12px}
.lightbox .close{position:absolute;top:16px;right:20px;color:#fff;font-size:30px;background:none;border:none;cursor:pointer;line-height:1}
.pcard .icon{width:56px;height:56px;border-radius:50%;background:#FAF5EA;display:flex;align-items:center;justify-content:center;margin:0 auto .7rem;color:var(--ac);font-size:26px}
.pcard .nom{font-weight:600;font-size:14px;margin-bottom:6px;min-height:36px}
.pcard .tags{margin-bottom:8px}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:600;margin:0 2px}
.td{background:#F6EEDD;color:#8A6D2A}.tm{background:#EAF3DE;color:#3B6D11}
.pcard .desc{font-size:12px;color:#8A8378;line-height:1.4;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lightbox .lb-info .d{font-size:13px;opacity:.8;margin:6px auto 0;max-width:520px;line-height:1.45;white-space:pre-line;max-height:25vh;overflow-y:auto}
.pcard .precio{font-size:17px;font-weight:700;color:var(--ac)}
.empty{max-width:1100px;margin:3rem auto;text-align:center;color:#aaa;padding:0 1rem}
footer{text-align:center;padding:1.5rem;color:#bbb;font-size:11px}
/* ── Admin ── */
.adminwrap{max-width:900px;margin:0 auto;padding:1.25rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.1rem;margin-bottom:.9rem}
.ct{font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.5px;margin-bottom:.75rem}
.frow{margin-bottom:.75rem}
.frow label{display:block;font-size:11px;color:#aaa;margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--border);font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase}
.tbl td{padding:8px 10px;border-bottom:1px solid #F7F7F7}
.tbl tr:last-child td{border:none}
.loginbox{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#151312;padding:1rem}
.loginbox .box{background:#fff;border-radius:16px;padding:2rem 1.75rem;width:100%;max-width:340px}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:1fr 1fr}}
</style>
</head>

function authHeaders(){
  const token=(S.session&&S.session.access_token)||KEY;
  return {'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+token};
}
async function api(m,t,b,q=''){
  const r=await fetch(`${SB}/rest/v1/${t}${q}`,{method:m,headers:{...authHeaders(),'Prefer':'return=representation'},...(b?{body:JSON.stringify(b)}:{})});
  const txt=await r.text();if(!r.ok){console.error(t,r.status,txt);return{__error:txt};}return txt?JSON.parse(txt):[];
}
const dbGet=(t,q)=>api('GET',t,null,q||'');
const dbPost=(t,b)=>api('POST',t,b);
const dbPatch=(t,b,q)=>api('PATCH',t,b,q);
const dbDel=(t,q)=>api('DELETE',t,null,q);

async function subirImagen(file){
  if(!file)return null;
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
  const path=`${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
  const r=await fetch(`${SB}/storage/v1/object/productos/${path}`,{
    method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+(S.session&&S.session.access_token||''),'Content-Type':file.type||'application/octet-stream'},
    body:file
  });
  if(!r.ok)return null;
  return `${SB}/storage/v1/object/public/productos/${path}`;
}

const TIPOS=['Anillo','Cadena','Aretes','Pulsera','Dije','Tobillera','Reloj','Set','Otro'];
const MATERIALES=['Oro 18k','Oro laminado','Plata 925','Acero quirúrgico','Acero dorado','Perlas','Otro'];
const ICONOS={Anillo:'ti-circle-dot',Cadena:'ti-link',Aretes:'ti-droplet',Pulsera:'ti-bracelet',Dije:'ti-diamond',Tobillera:'ti-shoe',Reloj:'ti-clock',Set:'ti-gift',Otro:'ti-sparkles'};

let S={
  view: location.hash==='#admin' ? 'admin' : 'catalogo',
  session:null,
  productos:[],
  filtroTexto:'',filtroTipo:'',
};

const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n||0);

function toast(msg,ok=true){
  document.querySelectorAll('.tst').forEach(e=>e.remove());
  const d=document.createElement('div');d.className='tst';
  d.style.cssText=`position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:9999;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap;${ok?'background:#1F5014;color:#fff':'background:#9B1512;color:#fff'}`;
  d.textContent=(ok?'✓ ':'⚠ ')+msg;document.body.appendChild(d);setTimeout(()=>d.remove(),3000);
}

window.addEventListener('hashchange',()=>{S.view=location.hash==='#admin'?'admin':'catalogo';render();});

/* ══════════ CATÁLOGO PÚBLICO ══════════ */
async function cargarCatalogo(){
  const r=await fetch(`${SB}/rest/v1/catalogo_publico?select=*&order=tipo,nombre`,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
  S.productos=r.ok?await r.json():[];
}
function productosFiltrados(){
  const t=S.filtroTexto.toLowerCase();
  return S.productos.filter(p=>
    (!t||p.nombre.toLowerCase().includes(t)) &&
    (!S.filtroTipo||p.tipo===S.filtroTipo)
  );
}
function renderCatalogo(){
  const list=productosFiltrados();
  const tiposDisponibles=[...new Set(S.productos.map(p=>p.tipo))].sort();
  document.getElementById('root').innerHTML=`
  <div class="topbar">
    <img src="data:image/png;base64,${LOGO_B64}">
  </div>
  <div class="hero">
    <img src="data:image/png;base64,${LOGO_B64}">
    <h1>${NOMBRE_NEGOCIO}</h1>
    <p>Catálogo de piezas disponibles</p>
  </div>
  <div class="toolbar">
    <input id="ft" placeholder="Buscar por nombre..." value="${S.filtroTexto}">
    <select id="ftipo">
      <option value="">Todos los tipos</option>
      ${tiposDisponibles.map(t=>`<option value="${t}" ${S.filtroTipo===t?'selected':''}>${t}</option>`).join('')}
    </select>
  </div>
  <div class="grid" id="grid">${list.length?list.map(cardHTML).join(''):''}</div>
  ${!list.length?`<div class="empty"><i class="ti ti-mood-empty" style="font-size:32px"></i><div style="margin-top:8px">No hay piezas que coincidan con tu búsqueda</div></div>`:''}
  <footer>${NOMBRE_NEGOCIO} © ${new Date().getFullYear()}</footer>`;
  document.getElementById('ft').oninput=e=>{S.filtroTexto=e.target.value;document.getElementById('grid').outerHTML=`<div class="grid" id="grid">${productosFiltrados().length?productosFiltrados().map(cardHTML).join(''):''}</div>`;};
  document.getElementById('ftipo').onchange=e=>{S.filtroTipo=e.target.value;render();};
}
function cardHTML(p){
  const icon=ICONOS[p.tipo]||'ti-sparkles';
  const tc=p.material?.includes('Oro')?'td':'tm';
  const imgBlock=p.imagen_url
    ?`<div class="foto" onclick="abrirFoto(${p.id})"><img src="${p.imagen_url}" loading="lazy"></div>`
    :`<div class="icon"><i class="ti ${icon}"></i></div>`;
  return `<div class="pcard">
    ${imgBlock}
    <div class="nom">${p.nombre}</div>
    <div class="tags"><span class="tag ${tc}">${p.material}</span> <span class="tag tm">${p.tipo}</span></div>
    ${p.descripcion?`<div class="desc">${esc(p.descripcion)}</div>`:''}
    <div class="precio">${fmt(p.precio)}</div>
  </div>`;
}
function abrirFoto(id){
  const p=S.productos.find(x=>x.id===id);if(!p?.imagen_url)return;
  const d=document.createElement('div');d.className='lightbox';
  d.innerHTML=`<button class="close">&times;</button>
    <div class="lb-img"><img src="${p.imagen_url}" alt="${p.nombre}"></div>
    <div class="lb-info"><div class="n">${p.nombre}</div><div class="p">${fmt(p.precio)}</div>${p.descripcion?`<div class="d">${esc(p.descripcion)}</div>`:''}</div>
    <div class="lb-hint">Toca la imagen para acercar · Toca fuera para cerrar</div>`;
  const img=d.querySelector('img');
  const cerrar=()=>{d.remove();document.removeEventListener('keydown',onKey);};
  const onKey=e=>{if(e.key==='Escape')cerrar();};
  // Mueve el punto de zoom hacia donde está el cursor/dedo
  const enfocar=(x,y)=>{const r=img.getBoundingClientRect();
    img.style.transformOrigin=`${Math.min(100,Math.max(0,(x-r.left)/r.width*100))}% ${Math.min(100,Math.max(0,(y-r.top)/r.height*100))}%`;};
  img.onclick=e=>{e.stopPropagation();
    if(!img.classList.contains('zoom'))enfocar(e.clientX,e.clientY);
    img.classList.toggle('zoom');};
  img.onmousemove=e=>{if(img.classList.contains('zoom'))enfocar(e.clientX,e.clientY);};
  img.ontouchmove=e=>{if(img.classList.contains('zoom')&&e.touches.length===1){e.preventDefault();enfocar(e.touches[0].clientX,e.touches[0].clientY);}};
  d.querySelector('.lb-info').onclick=e=>e.stopPropagation();
  d.querySelector('.close').onclick=e=>{e.stopPropagation();cerrar();};
  d.onclick=cerrar;
  document.addEventListener('keydown',onKey);
  document.body.appendChild(d);
}

/* ══════════ ADMIN ══════════ */
async function cargarAdmin(){
  const r=await api('GET','inventario','','?order=tipo,nombre');
  S.productos=Array.isArray(r)?r:[];
}
function renderAdmin(){
  if(!S.session){renderLoginAdmin();return;}
  document.getElementById('root').innerHTML=`
  <div class="topbar">
    <img src="data:image/png;base64,${LOGO_B64}">
    <a class="adminlink" href="#" style="margin-left:auto">Ver catálogo</a>
    <button class="btn btn-sm" onclick="doLogout()" style="margin-left:10px;background:transparent;border-color:#444;color:#888;min-height:30px"><i class="ti ti-logout"></i></button>
  </div>
  <div class="adminwrap">
    <div class="ph" style="display:flex;align-items:center;gap:10px;margin:1rem 0"><h2 style="font-size:18px;font-weight:600">Administrar catálogo</h2></div>
    <div class="card" style="border:2px solid var(--ac)">
      <div class="ct" style="color:var(--ac)">Agregar pieza nueva</div>
      <div class="formgrid">
        <div class="frow"><label>Nombre / Referencia</label><input id="a-n" placeholder="Ej: COQUETA (11B #3)"></div>
        <div class="frow"><label>Tipo</label><input id="a-t" list="dl-tipos" placeholder="Ej: Anillo" autocomplete="off"><datalist id="dl-tipos">${TIPOS.map(t=>`<option value="${t}">`).join('')}</datalist></div>
        <div class="frow"><label>Material</label><input id="a-m" list="dl-mats" placeholder="Ej: Oro 18k" autocomplete="off"><datalist id="dl-mats">${MATERIALES.map(m=>`<option value="${m}">`).join('')}</datalist></div>
        <div class="frow"><label>Cantidad</label><input id="a-c" type="number" value="1" min="0"></div>
        <div class="frow"><label>Precio</label><input id="a-p" type="number" value="100000"></div>
        <div class="frow"><label>Foto (opcional)</label><input id="a-foto" type="file" accept="image/*"></div>
      </div>
      <div class="frow"><label>Descripción (opcional)</label><textarea id="a-d" rows="3" placeholder="Ej: Anillo con circón central, ajustable, ideal para regalo"></textarea></div>
      <button id="a-btn" class="btn btn-r" onclick="agregarProducto()"><i class="ti ti-plus"></i> Agregar al catálogo</button>
    </div>
    <div class="card">
      <div class="ct">Piezas en el catálogo (${S.productos.length})</div>
      <div style="overflow-x:auto">
      <table class="tbl"><thead><tr><th style="width:50px">Foto</th><th>Nombre</th><th>Tipo</th><th>Material</th><th style="width:90px">Cant.</th><th style="width:130px">Precio</th><th style="width:50px"></th></tr></thead>
      <tbody>${S.productos.map(rowHTML).join('')}</tbody></table>
      </div>
    </div>
  </div>`;
}
function rowHTML(p){
  const thumb=p.imagen_url
    ?`<img src="${p.imagen_url}" style="width:38px;height:38px;object-fit:cover;border-radius:6px">`
    :`<div style="width:38px;height:38px;border-radius:6px;background:#F5F4F2;display:flex;align-items:center;justify-content:center;color:#ccc"><i class="ti ${ICONOS[p.tipo]||'ti-sparkles'}"></i></div>`;
  return `<tr>
    <td>
      ${thumb}
      <input id="foto-${p.id}" type="file" accept="image/*" style="display:none" onchange="cambiarFoto(${p.id},this.files[0])">
      <button class="btn btn-sm" onclick="document.getElementById('foto-${p.id}').click()" style="margin-top:4px;padding:2px 6px"><i class="ti ti-camera"></i></button>
    </td>
    <td><div style="font-weight:600">${p.nombre}</div>
      <textarea rows="2" placeholder="Descripción..." style="margin-top:4px;padding:4px 6px;font-size:12px;min-width:160px" onchange="editarCampo(${p.id},'descripcion',this.value.trim()||null)">${esc(p.descripcion)}</textarea></td>
    <td>${p.tipo}</td>
    <td>${p.material}</td>
    <td><input type="number" min="0" value="${p.cant}" style="width:65px;padding:4px" onchange="editarCampo(${p.id},'cant',this.value,true)"></td>
    <td><input type="number" min="0" value="${p.precio}" style="width:110px;padding:4px" onchange="editarCampo(${p.id},'precio',this.value,true)"></td>
    <td><button class="btn btn-sm" onclick="eliminarProducto(${p.id})" style="color:var(--ac);border-color:#F0DDBD;padding:4px 7px"><i class="ti ti-trash"></i></button></td>
  </tr>`;
}
async function cambiarFoto(id,file){
  if(!file)return;
  toast('Subiendo foto...');
  const url=await subirImagen(file);
  if(!url){toast('No se pudo subir la foto',false);return;}
  const r=await dbPatch('inventario',{imagen_url:url},`?id=eq.${id}`);
  if(r&&r.__error){toast('No se pudo guardar la foto',false);return;}
  const p=S.productos.find(x=>x.id===id);if(p)p.imagen_url=url;
  toast('Foto actualizada ✓');renderAdmin();
}
async function editarCampo(id,campo,val,numero){
  const v=numero?(parseInt(val)||0):val;
  const r=await dbPatch('inventario',{[campo]:v},`?id=eq.${id}`);
  if(r&&r.__error){toast('No se pudo guardar el cambio',false);return;}
  const p=S.productos.find(x=>x.id===id);if(p)p[campo]=v;
  toast('Guardado ✓');
}
async function agregarProducto(){
  const nombre=document.getElementById('a-n').value.trim();
  const tipo=document.getElementById('a-t').value.trim();
  const material=document.getElementById('a-m').value.trim();
  const cant=parseInt(document.getElementById('a-c').value)||0;
  const precio=parseInt(document.getElementById('a-p').value)||0;
  const fotoFile=document.getElementById('a-foto').files[0];
  const descripcion=document.getElementById('a-d').value.trim();
  if(!nombre){toast('Escribe el nombre de la pieza',false);return;}
  if(!tipo){toast('Escribe el tipo de la pieza',false);return;}
  if(!material){toast('Escribe el material de la pieza',false);return;}
  const btn=document.getElementById('a-btn');
  btn.disabled=true;btn.innerHTML='<i class="ti ti-refresh spin"></i> Guardando...';
  let imagen_url=null;
  if(fotoFile){
    imagen_url=await subirImagen(fotoFile);
    if(!imagen_url)toast('No se pudo subir la foto, se guardó sin foto',false);
  }
  const r=await dbPost('inventario',{nombre,tipo,material,cant,precio,pc:0,origen:'nuevo',imagen_url,...(descripcion?{descripcion}:{})});
  btn.disabled=false;btn.innerHTML='<i class="ti ti-plus"></i> Agregar al catálogo';
  if(r&&r.__error){toast('No se pudo agregar (revisa tu sesión)',false);return;}
  toast('Pieza agregada ✓');
  document.getElementById('a-n').value='';
  document.getElementById('a-foto').value='';
  document.getElementById('a-d').value='';
  await cargarAdmin();renderAdmin();
}
async function eliminarProducto(id){
  if(!confirm('¿Eliminar esta pieza del catálogo?'))return;
  const r=await dbDel('inventario',`?id=eq.${id}`);
  if(r&&r.__error){toast('No tienes permiso para eliminar piezas',false);return;}
  S.productos=S.productos.filter(p=>p.id!==id);
  toast('Eliminado ✓');renderAdmin();
}

function renderLoginAdmin(){
  document.getElementById('root').innerHTML=`<div class="loginbox"><div class="box">
    <div style="text-align:center;margin-bottom:1.5rem;background:#0A0908;padding:1rem;border-radius:10px">
      <img src="data:image/png;base64,${LOGO_B64}" style="height:90px;object-fit:contain">
    </div>
    <div style="text-align:center;margin-bottom:1.5rem"><div style="font-size:17px;font-weight:600">Panel de administrador</div><div style="font-size:12px;color:#aaa">Entra para administrar el catálogo</div></div>
    <label style="display:block;font-size:12px;color:#666;margin-bottom:3px;font-weight:600">Correo electrónico</label>
    <input id="lu" type="email" placeholder="tu@correo.com" style="margin-bottom:10px">
    <label style="display:block;font-size:12px;color:#666;margin-bottom:3px;font-weight:600">Contraseña</label>
    <input id="lp" type="password" placeholder="••••••" onkeydown="if(event.key==='Enter')doLoginAdmin()" style="margin-bottom:6px">
    <div id="lerr" style="font-size:12px;color:var(--ac);margin:4px 0;display:none"></div>
    <button id="lbtn" class="btn btn-r btn-full" style="margin-top:.75rem;padding:11px" onclick="doLoginAdmin()"><i class="ti ti-login"></i> Ingresar</button>
    <a href="#" style="display:block;text-align:center;margin-top:1rem;font-size:12px;color:#999">← Volver al catálogo</a>
  </div></div>`;
}
async function doLoginAdmin(){
  const email=document.getElementById('lu').value.trim();
  const pw=document.getElementById('lp').value;
  const errEl=document.getElementById('lerr');errEl.style.display='none';
  const btn=document.getElementById('lbtn');
  if(!email||!pw){errEl.style.display='';errEl.textContent='Ingresa correo y contraseña';return;}
  btn.disabled=true;btn.innerHTML='<i class="ti ti-refresh spin"></i> Ingresando...';
  try{
    const r=await fetch(`${SB}/auth/v1/token?grant_type=password`,{
      method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},
      body:JSON.stringify({email,password:pw})
    });
    const data=await r.json();
    if(!r.ok||!data.access_token){
      errEl.style.display='';errEl.textContent='Correo o contraseña incorrectos';
      btn.disabled=false;btn.innerHTML='<i class="ti ti-login"></i> Ingresar';return;
    }
    S.session={email,access_token:data.access_token};
    await cargarAdmin();renderAdmin();
  }catch(e){
    errEl.style.display='';errEl.textContent='Error de conexión, intenta de nuevo';
    btn.disabled=false;btn.innerHTML='<i class="ti ti-login"></i> Ingresar';
  }
}
function doLogout(){S.session=null;location.hash='admin';renderAdmin();}

async function render(){
  if(S.view==='admin'){
    if(S.session){await cargarAdmin();}
    renderAdmin();
  }else{
    await cargarCatalogo();
    renderCatalogo();
  }
}
render();
</script>
</body>
</html>
